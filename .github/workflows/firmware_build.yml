name: Build Firmware & Update Web Installer

on:
  push:
    branches:
      - Nematostella-time-series-IR
    paths:
      - "Firmware/**"
  workflow_dispatch:
  # The LSFT firmware lives in another repository, so a change there cannot
  # trigger this workflow by path. Run it by hand after such a change, or have
  # napari-lsft send a repository_dispatch with this type.
  repository_dispatch:
    types: [lsft-firmware]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('Firmware/LED_Nematostella/platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      # The light sheet tomograph's firmware is developed in its own repo.
      # Checking it out here keeps a single source of truth -- the alternative
      # would be a copy of the sources that quietly drifts.
      - name: Check out the LSFT firmware
        uses: actions/checkout@v4
        with:
          repository: s1alknau/napari-lsft
          path: napari-lsft

      - name: Build esp32dev
        run: |
          cd Firmware/LED_Nematostella
          pio run -e esp32dev

      - name: Build esp32-s3-box-3
        run: |
          cd Firmware/LED_Nematostella
          pio run -e esp32-s3-box-3

      - name: Build LSFT firmware
        run: |
          cd napari-lsft/firmware
          pio run -e lsft

      # -j 2 on purpose: the default parallelism spawns enough cc1plus to
      # exhaust the runner's memory on this target.
      - name: Build LSFT galvo firmware
        run: |
          cd napari-lsft/firmware/galvo
          pio run -e UC2_3_Xiao -j 2

      - name: Copy firmware binaries to docs/
        run: |
          BOOT_APP0=$(find ~/.platformio -name boot_app0.bin | head -1)

          mkdir -p docs/firmware/esp32dev
          cp Firmware/LED_Nematostella/.pio/build/esp32dev/firmware.bin   docs/firmware/esp32dev/
          cp Firmware/LED_Nematostella/.pio/build/esp32dev/bootloader.bin docs/firmware/esp32dev/
          cp Firmware/LED_Nematostella/.pio/build/esp32dev/partitions.bin docs/firmware/esp32dev/
          cp "$BOOT_APP0" docs/firmware/esp32dev/boot_app0.bin

          mkdir -p docs/firmware/esp32-s3-box-3
          cp Firmware/LED_Nematostella/.pio/build/esp32-s3-box-3/firmware.bin   docs/firmware/esp32-s3-box-3/
          cp Firmware/LED_Nematostella/.pio/build/esp32-s3-box-3/bootloader.bin docs/firmware/esp32-s3-box-3/
          cp Firmware/LED_Nematostella/.pio/build/esp32-s3-box-3/partitions.bin docs/firmware/esp32-s3-box-3/
          cp "$BOOT_APP0" docs/firmware/esp32-s3-box-3/boot_app0.bin

          # Same layout and offsets as esp32dev: the LSFT board is a classic
          # ESP32 too (the galvo fallback needs the two real DACs, which only
          # the classic part has).
          mkdir -p docs/firmware/lsft
          cp napari-lsft/firmware/.pio/build/lsft/firmware.bin   docs/firmware/lsft/
          cp napari-lsft/firmware/.pio/build/lsft/bootloader.bin docs/firmware/lsft/
          cp napari-lsft/firmware/.pio/build/lsft/partitions.bin docs/firmware/lsft/
          cp "$BOOT_APP0" docs/firmware/lsft/boot_app0.bin

          # The galvo board is an ESP32-S3 and its layout differs: the
          # bootloader sits at 0x0, not 0x1000, and it carries an OTA data
          # partition instead of boot_app0.
          mkdir -p docs/firmware/lsft-galvo
          GALVO=napari-lsft/firmware/galvo/.pio/build/UC2_3_Xiao
          cp $GALVO/firmware.bin          docs/firmware/lsft-galvo/
          cp $GALVO/bootloader.bin        docs/firmware/lsft-galvo/
          cp $GALVO/partitions.bin        docs/firmware/lsft-galvo/
          cp $GALVO/ota_data_initial.bin  docs/firmware/lsft-galvo/

      - name: Commit updated firmware binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/firmware/
          git diff --staged --quiet || git commit -m "ci: update firmware binaries ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
